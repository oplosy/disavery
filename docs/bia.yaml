# Business impact analysis for docsvc, read by the disavery CLI.
# The reasoning behind every number is in docs/bia.md.
service: docsvc
classification: tier-1

tiers:
  pilot-light:
    rpo: 60s
    rto: 15m
    mechanism: pgBackRest async WAL archive (archive_timeout 30s); site-b built from scratch
    cost: { always_on_nodes: 0, monthly_usd: 0 }
  warm-standby:
    rpo: 5s
    rto: 2m
    mechanism: async streaming replica; site-b always running
    cost: { always_on_nodes: 3, monthly_usd: 72 }  # 3 VMs at about $24/month, see bia.md

# Incidents repaired inside the production site, independent of the DR tier.
# They run on the pilot-light baseline (site a serves, no site b).
scenarios:
  s2-drop-table:    { rpo: 5s, rto: 15m }   # surgical: no unrelated write may be lost
  s3-bad-migration: { rpo: 60s, rto: 15m }
  s4-ransomware:    { rpo: 60s, rto: 30m }
  s5-secret-loss:   { rpo: 60s, rto: 20m }  # pilot-light site loss plus the age key

# S6, the random restore test: restore plus verification must finish within
# max_duration; pitr_tolerance is the window around the PITR target in which
# an in-flight write may legitimately land on either side.
restore_test:
  max_duration: 15m
  pitr_tolerance: 1s

# Preflight refuses to start a drill unless the environment is healthy.
preflight:
  max_backup_age: 2h       # incremental backups run hourly
  max_archive_age: 45s     # archive_timeout is 30s and the canary writes every second
  max_canary_silence: 10s
  min_canary_history: 1m   # two archive cycles of steady writes before an incident
