# Builds the DR site from the vault (pilot light, S1): an empty object store,
# the database restored from repo2 to the end of the archive and promoted,
# then the application. Extra var: dr_site (default b).
- name: Prepare the DR site
  hosts: "site_{{ dr_site | default('b') }}"
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Load SOPS secrets
      community.sops.load_vars:
        file: "{{ secrets_file }}"
        name: secrets

    - name: Gather facts
      ansible.builtin.setup:

- name: Base configuration
  hosts: "site_{{ dr_site | default('b') }}"
  roles:
    - base

# The attachments are copied from the vault by the runbook (disavery
# attachments copy); mc cannot copy out of an Object Lock bucket into a plain one.
- name: Object store
  hosts: "obj:&site_{{ dr_site | default('b') }}"
  roles:
    - role: minio
      minio_profile: site
      minio_replicate: false

- name: Database from repo2
  hosts: "db:&site_{{ dr_site | default('b') }}"
  roles:
    - role: restore
      restore_isolated: false
    - postgres
    - pgbackrest
    - postgres_exporter

- name: Application
  hosts: "app:&site_{{ dr_site | default('b') }}"
  roles:
    - role: docsvc
      docsvc_running: true
