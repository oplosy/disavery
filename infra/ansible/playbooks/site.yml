# Builds the lab for the current topology: active_site serves, standby_site
# (if any) runs a warm standby. Both come from the inventory; change them with
# `disavery env set`.
- name: Prepare all nodes
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Load SOPS secrets
      community.sops.load_vars:
        file: "{{ secrets_file }}"
        name: secrets

    - name: Gather facts
      ansible.builtin.setup:

- name: Base configuration
  hosts: all
  roles:
    - base

- name: Vault object store
  hosts: vaults
  roles:
    - role: minio
      minio_profile: vault

# The standby's bucket must exist before the active store replicates to it;
# tasks run on all hosts in order, so the bucket is created first.
- name: Site object stores
  hosts: obj
  roles:
    - role: minio
      minio_profile: site
      minio_replicate: "{{ site == active_site }}"
      minio_standby_store: "{{ ('obj-' + standby_site) if (standby_site and site == active_site) else '' }}"
      minio_seed_from: "{{ ('obj-' + active_site) if site == standby_site else '' }}"

- name: Primary database
  hosts: "db:&active"
  roles:
    - postgres
    - pgbackrest
    - postgres_exporter
    - pgbackrest_exporter

- name: Standby database
  hosts: "db:&standby"
  roles:
    - replica
    - postgres_exporter
    - pgbackrest_exporter

- name: Payment provider mock
  hosts: webhooks
  roles:
    - webhookmock

- name: Applications
  hosts: app
  roles:
    - docsvc

- name: Monitoring targets
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - monitoring_targets
