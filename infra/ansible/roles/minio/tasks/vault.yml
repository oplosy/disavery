- name: Create Object Lock buckets
  ansible.builtin.command: mc mb --with-lock local/{{ item }}
  loop: [pgbackrest, attachments]
  register: vault_mb
  # This mc release claims "created successfully" for existing buckets even with
  # --ignore-existing, so treat its "already own it" error as unchanged instead.
  changed_when: vault_mb.rc == 0
  failed_when: vault_mb.rc != 0 and 'already own it' not in vault_mb.stderr

- name: Set default compliance retention
  ansible.builtin.command: mc retention set --default compliance {{ vault_retention_days }}d local/{{ item }}
  loop: [pgbackrest, attachments]
  changed_when: false

- name: Read lifecycle rules
  ansible.builtin.command: mc ilm rule ls --json local/{{ item }}
  loop: [pgbackrest, attachments]
  register: vault_ilm
  changed_when: false
  failed_when: false

- name: Expire noncurrent versions once the lock has lapsed
  ansible.builtin.command: mc ilm rule add --noncurrent-expire-days {{ vault_retention_days + 1 }} local/{{ item.item }}
  loop: "{{ vault_ilm.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'NoncurrentVersionExpiration' not in item.stdout"
  changed_when: true

# Two production identities: the writer pushes backups and replicas but may
# not destroy a version; the reader only restores (S4, ADR 0006).
- name: Write the vault user policies
  ansible.builtin.template:
    src: "{{ item.policy }}.json.j2"
    dest: "/etc/minio/{{ item.policy }}.json"
    mode: "0644"
  loop: "{{ minio_vault_users }}"
  loop_control:
    label: "{{ item.policy }}"

- name: Create the vault user policies
  ansible.builtin.command: mc admin policy create local {{ item.policy }} /etc/minio/{{ item.policy }}.json
  loop: "{{ minio_vault_users }}"
  loop_control:
    label: "{{ item.policy }}"
  changed_when: false

- name: Create the vault users
  ansible.builtin.command: mc admin user add local {{ item.access_key }} {{ item.secret_key }}
  loop: "{{ minio_vault_users }}"
  changed_when: false
  no_log: true

- name: Read the vault users' policies
  ansible.builtin.command: mc admin user info --json local {{ item.access_key }}
  loop: "{{ minio_vault_users }}"
  loop_control:
    label: "{{ item.access_key }}"
  register: vault_user_info
  changed_when: false

# Attaching is not idempotent in this mc release (rc 0 every time), so check first.
- name: Attach the policies to the vault users
  ansible.builtin.command: mc admin policy attach local {{ item.item.policy }} --user {{ item.item.access_key }}
  loop: "{{ vault_user_info.results }}"
  loop_control:
    label: "{{ item.item.access_key }}"
  when: "item.item.policy not in ((item.stdout | from_json).policyName | default('')).split(',')"
  changed_when: true

- name: Install the replica lock sweeper
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: vault-lock-sweeper.sh.j2, dest: /usr/local/bin/vault-lock-sweeper, mode: "0755" }
    - { src: vault-lock-sweeper.service.j2, dest: /etc/systemd/system/vault-lock-sweeper.service, mode: "0644" }
    - { src: vault-lock-sweeper.timer.j2, dest: /etc/systemd/system/vault-lock-sweeper.timer, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart the replica lock sweeper

- name: Enable the replica lock sweeper
  ansible.builtin.systemd_service:
    name: vault-lock-sweeper.timer
    state: started
    enabled: true
    daemon_reload: true
