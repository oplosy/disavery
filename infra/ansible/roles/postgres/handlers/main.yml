- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres_service }}"
    state: restarted

- name: Reload PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres_service }}"
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
