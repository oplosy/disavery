# Packages only; restore nodes reuse this (role restore).
- name: Install PostgreSQL packages
  ansible.builtin.import_tasks: install.yml

# Configuration files only; standby nodes reuse this (role replica).
- name: Configure PostgreSQL files
  ansible.builtin.import_tasks: config.yml

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres_service }}"
    state: started
    enabled: true

- name: Apply PostgreSQL changes now
  ansible.builtin.meta: flush_handlers

- name: Create the application role
  community.postgresql.postgresql_user:
    name: "{{ postgres_app_user }}"
    password: "{{ secrets.postgres.app_password }}"
  become: true
  become_user: postgres
  no_log: true

- name: Create the application database
  community.postgresql.postgresql_db:
    name: "{{ postgres_app_db }}"
    owner: "{{ postgres_app_user }}"
  become: true
  become_user: postgres

- name: Create the replication role
  community.postgresql.postgresql_user:
    name: replicator
    password: "{{ secrets.postgres.replication_password }}"
    role_attr_flags: LOGIN,REPLICATION
  become: true
  become_user: postgres
  no_log: true

# pg_rewind (failback, S7) connects as replicator; these are the functions it
# needs, so it does not need a superuser.
- name: Allow the replication role to run pg_rewind
  community.postgresql.postgresql_privs:
    db: postgres
    type: function
    schema: pg_catalog
    objs: "pg_ls_dir(text:boolean:boolean),pg_stat_file(text:boolean),pg_read_binary_file(text),pg_read_binary_file(text:bigint:bigint:boolean)"
    privs: EXECUTE
    roles: replicator
  become: true
  become_user: postgres

- name: Create the monitoring role
  community.postgresql.postgresql_user:
    name: postgres_exporter
    role_attr_flags: LOGIN
  become: true
  become_user: postgres

- name: Grant pg_monitor to the monitoring role
  community.postgresql.postgresql_membership:
    groups: [pg_monitor]
    target_roles: [postgres_exporter]
  become: true
  become_user: postgres

- name: Enable amcheck for integrity verification
  community.postgresql.postgresql_ext:
    name: amcheck
    db: "{{ postgres_app_db }}"
  become: true
  become_user: postgres
