- name: Create the postgres_exporter user
  ansible.builtin.user:
    name: postgres_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download postgres_exporter
  ansible.builtin.get_url:
    url: "{{ postgres_exporter_release }}/{{ postgres_exporter_archive }}.tar.gz"
    checksum: "sha256:{{ postgres_exporter_sha256 }}"
    dest: "/opt/{{ postgres_exporter_archive }}.tar.gz"
    mode: "0644"
    timeout: 60

- name: Unpack postgres_exporter
  ansible.builtin.unarchive:
    src: "/opt/{{ postgres_exporter_archive }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/{{ postgres_exporter_archive }}/postgres_exporter"

- name: Install postgres_exporter
  ansible.builtin.copy:
    src: "/opt/{{ postgres_exporter_archive }}/postgres_exporter"
    dest: /usr/local/bin/postgres_exporter
    remote_src: true
    mode: "0755"
  notify: Restart postgres_exporter

- name: Install the postgres_exporter unit
  ansible.builtin.template:
    src: postgres_exporter.service.j2
    dest: /etc/systemd/system/postgres_exporter.service
    mode: "0644"
  notify: Restart postgres_exporter

- name: Start postgres_exporter
  ansible.builtin.systemd_service:
    name: postgres_exporter
    state: started
    enabled: true
    daemon_reload: true
