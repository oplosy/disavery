- name: Install PostgreSQL
  ansible.builtin.include_role:
    name: postgres
    tasks_from: install
    public: true

# Same configuration as the primary (including archive_mode = on, which only
# takes effect after promotion), so a promoted standby archives at once.
- name: Configure PostgreSQL files
  ansible.builtin.include_role:
    name: postgres
    tasks_from: config

- name: Install and configure pgBackRest
  ansible.builtin.include_role:
    name: pgbackrest
    tasks_from: config

- name: Fetch WAL from the repositories when streaming falls behind
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (role replica).
      restore_command = 'pgbackrest --stanza={{ pgbackrest_stanza }} archive-get %f "%p"'
    dest: "{{ postgres_conf_dir }}/conf.d/standby.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart PostgreSQL

- name: Check whether this node is already a standby
  ansible.builtin.stat:
    path: "{{ replica_data_dir }}/standby.signal"
  register: replica_signal

- name: Build the standby from the primary
  when: not replica_signal.stat.exists
  block:
    - name: Stop PostgreSQL
      ansible.builtin.systemd_service:
        name: "{{ postgres_service }}"
        state: stopped

    - name: Remove the initial cluster's data
      ansible.builtin.file:
        path: "{{ replica_data_dir }}"
        state: absent

    # -R writes standby.signal and primary_conninfo (application_name names
    # the standby in pg_stat_replication); the password comes from .pgpass.
    - name: Copy the primary with pg_basebackup
      ansible.builtin.command: >-
        /usr/lib/postgresql/{{ pg_version }}/bin/pg_basebackup
        -D {{ replica_data_dir }} -X stream -R --checkpoint=fast
        -d "host={{ replica_primary }} user=replicator application_name={{ inventory_hostname }}"
      become: true
      become_user: postgres
      changed_when: true

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres_service }}"
    state: started
    enabled: true

- name: Apply PostgreSQL changes now
  ansible.builtin.meta: flush_handlers

# A rejoining standby first replays from the archive everything the primary
# wrote while it was away (gigabytes after a failback with a large database),
# then streams. Wait as long as replay advances; give up after 60 s without
# progress, so a stuck standby still fails.
- name: Wait until the standby streams from the primary
  ansible.builtin.shell: |
    set -eu
    last=""; idle=0
    until [ "$(psql -XAtc 'SELECT status FROM pg_stat_wal_receiver')" = streaming ]; do
      lsn=$(psql -XAtc 'SELECT pg_last_wal_replay_lsn()')
      if [ "$lsn" = "$last" ]; then
        idle=$((idle + 1))
        if [ "$idle" -ge 30 ]; then
          echo "replay stuck at $lsn for 60 s" >&2
          exit 1
        fi
      else
        idle=0; last=$lsn
      fi
      sleep 2
    done
  args:
    executable: /bin/bash
  become: true
  become_user: postgres
  changed_when: false
