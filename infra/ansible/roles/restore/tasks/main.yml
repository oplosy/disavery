- name: Check the restore parameters
  ansible.builtin.assert:
    that:
      - not (restore_isolated | bool) or restore_target | length > 0
    fail_msg: an isolated restore (S2, S6) needs restore_target

- name: Install PostgreSQL
  ansible.builtin.include_role:
    name: postgres
    tasks_from: install
    public: true

# An isolated node only ever reads the vault. A node that becomes the primary
# keeps the writer, because it archives from its first moment.
- name: Install and configure pgBackRest
  ansible.builtin.include_role:
    name: pgbackrest
    tasks_from: config
  vars:
    pgbackrest_repo2_identity: "{{ 'reader' if restore_isolated | bool else 'writer' }}"

# Defence in depth next to --archive-mode=off below: a restored test cluster
# that archived into the production stanza would corrupt the repositories.
- name: Never archive from an isolated restore
  ansible.builtin.copy:
    content: "# Managed by Ansible (role restore).\narchive_mode = off\n"
    dest: "{{ postgres_conf_dir }}/conf.d/restore.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  when: restore_isolated | bool

# A new primary must archive from its first moment: the timeline history file
# written at promotion is what later restores follow.
- name: Archive from a restore that becomes the primary
  ansible.builtin.include_role:
    name: postgres
    tasks_from: config
  when: not (restore_isolated | bool)

- name: Stop PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres_service }}"
    state: stopped

- name: Restore the backup
  ansible.builtin.command: >-
    pgbackrest --stanza={{ pgbackrest_stanza }} --repo={{ restore_repo }}
    {{ ('--set=' + restore_set) if restore_set else '' }}
    {{ ('--type=time "--target=' + restore_target + '" --target-action=promote') if restore_target else '--type=default' }}
    {{ '--archive-mode=off' if restore_isolated | bool else '' }}
    --delta restore
  become: true
  become_user: postgres
  # A restore needs no write access to the vault (S4, ADR 0006).
  environment:
    PGBACKREST_REPO2_S3_KEY: "{{ secrets.minio.vault_reader_access_key }}"
    PGBACKREST_REPO2_S3_KEY_SECRET: "{{ secrets.minio.vault_reader_secret_key }}"
  changed_when: true

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres_service }}"
    state: started

- name: Wait until recovery is complete and the cluster is promoted
  ansible.builtin.command: psql -XAtc "SELECT pg_is_in_recovery()"
  become: true
  become_user: postgres
  register: restore_recovery
  until: restore_recovery.stdout == "f"
  retries: 120
  delay: 5
  changed_when: false

# The unit's checkpoint after start (ADR 0005) can run while the restore is
# still recovering; the promotion's end-of-recovery checkpoint then puts the
# checkpointer to sleep for a whole checkpoint_timeout, and archive_timeout is
# ignored until it wakes. A checkpoint after the promotion wakes it at once.
- name: Checkpoint after the promotion so archive_timeout applies at once
  ansible.builtin.command: psql -XAtqc CHECKPOINT
  become: true
  become_user: postgres
  when: not (restore_isolated | bool)
  changed_when: true
