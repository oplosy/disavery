global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Targets and their role (primary, standby, none) come from the topology;
  # see infra/ansible/roles/monitoring_targets.
  - job_name: postgres
    file_sd_configs:
      - files: ["/etc/prometheus/targets/postgres.json"]
