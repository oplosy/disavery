id: s5-secret-loss
description: >-
  Lose the production site and, with it, the age key that decrypts every
  secret. Recovery starts by retrieving the key from escrow; only then can the
  pilot-light rebuild of site b decrypt the secrets it needs.
preflight:
  - id: topology
    check: topology
    with: { active_site: a, standby_site: "" }
vars:
  from_site: a
  to_site: b
phases:
  - name: inject
    steps:
      - id: kill-site-a
        run: docker kill app-{{.from_site}} db-{{.from_site}} obj-{{.from_site}}
        timeout: 1m
      # The key is moved out of reach, not destroyed: cleanup puts it back if
      # recovery from escrow fails, so a failed drill cannot lose the lab.
      - id: lose-age-key
        run: >-
          install -d -m 0700 /state/quarantine &&
          mv /secrets/age/keys.txt /state/quarantine/age-keys-{{.run_id}}.txt
        timeout: 1m
      - id: secrets-unreadable
        run: "! sops --decrypt /secrets/local.sops.yaml >/dev/null 2>&1"
        timeout: 1m
  - name: detect
    steps:
      - id: primary-down-alert
        wait_alert: PostgresPrimaryDown
        timeout: 2m
  - name: decide
    steps:
      - id: declare-disaster
        manual: "Site a and the age key are gone. Retrieve the key from escrow and fail over to site b?"
        auto_after: 30s
  - name: recover
    steps:
      # Nothing below can decrypt a secret until this step succeeds.
      - id: retrieve-key-from-escrow
        run: >-
          install -m 0600 /escrow/age-keys.txt /secrets/age/keys.txt &&
          sops --decrypt /secrets/local.sops.yaml >/dev/null
        timeout: 1m
      # From here on as in s1-site-loss (pilot light).
      - id: provision-site-b
        run: >-
          build/disavery env set site_b_enabled=true &&
          terraform -chdir=infra/terraform/envs/local apply -no-color -input=false -auto-approve
          -target='module.site["{{.to_site}}"]' -target=local_file.inventory
        timeout: 5m
      - id: build-site-b
        run: ansible-playbook infra/ansible/playbooks/rebuild-site.yml -e target_site={{.to_site}}
        timeout: 20m
      - id: copy-attachments
        run: build/disavery attachments copy --from vault --to obj-{{.to_site}}
        timeout: 20m
      - id: repoint-traffic
        run: >-
          build/disavery env set active_site={{.to_site}} standby_site= &&
          terraform -chdir=infra/terraform/envs/local apply -no-color -input=false -auto-approve
          -target=docker_container.dns -target=docker_container.edge -target=local_file.inventory
        timeout: 5m
      - id: repoint-third-parties
        run: ansible-playbook infra/ansible/playbooks/repoint.yml
        timeout: 10m
      - id: service-ready
        wait_http: { url: "https://docs.disavery.test/readyz" }
        timeout: 2m
  - name: verify
    steps:
      - { id: data-loss, check: canary }
      - { id: recovery-time, check: prober }
      - { id: integrity, check: amcheck, with: { host: "db-{{.to_site}}" } }
      - { id: rules, check: business-rules, with: { host: "db-{{.to_site}}" } }
      - { id: attachments, check: db-object-consistency, with: { host: "db-{{.to_site}}", store: "obj-{{.to_site}}" } }
      - { id: payment-callback, check: webhook-roundtrip }
cleanup:
  - id: return-quarantined-key
    run: >-
      q=/state/quarantine/age-keys-{{.run_id}}.txt;
      if [ ! -e "$q" ]; then exit 0; fi;
      if [ ! -s /secrets/age/keys.txt ]; then mv "$q" /secrets/age/keys.txt; echo "escrow recovery failed; quarantined key put back";
      elif cmp -s "$q" /secrets/age/keys.txt; then rm -f "$q"; echo "the escrowed key matches the lost one";
      else echo "the recovered key differs from the lost one; keeping $q" >&2; exit 1; fi
    timeout: 1m
